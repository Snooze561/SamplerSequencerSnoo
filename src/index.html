<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <title>Snoo Sequencer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="transport">
    <div class="logo">SNOO<span>-16</span></div>

    <button id="play" class="play" title="Lecture / Stop (barre d'espace)">▶ PLAY</button>

    <label class="control">
      <span>TEMPO</span>
      <input id="bpm-range" type="range" min="40" max="240" value="120">
      <input id="bpm" type="number" min="40" max="240" value="120">
      <span>BPM</span>
    </label>

    <label class="control">
      <span>VOLUME</span>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8">
    </label>

    <label class="control toggle">
      <input id="metronome" type="checkbox">
      <span>MÉTRONOME</span>
    </label>
  </header>

  <nav class="patterns">
    <span class="label">PATTERN</span>
    <div id="pattern-buttons" class="pattern-buttons"></div>
    <button id="clear" class="small" title="Effacer tous les pas du pattern">EFFACER</button>
  </nav>

  <main>
    <div class="grid" id="grid">
      <div class="track-head"></div>
      <div class="step-numbers" id="step-numbers"></div>
    </div>
    <p class="hint">Clique sur une case pour placer un son. Clique sur le nom d'une piste pour l'écouter. Tout est sauvegardé automatiquement.</p>
  </main>

  <script type="module" src="renderer.js"></script>
</body>
</html>
